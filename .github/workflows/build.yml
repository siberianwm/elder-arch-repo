name: Сборка и публикация репозитория

on:
  schedule:
    # ежедневно в 03:00 UTC (10:00 по Кемерово) — только ПРОВЕРКА версии xray,
    # сборка запускается лишь если версия у XTLS выросла
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Какие пакеты собрать: имена через пробел, либо all'
        required: false
        default: 'all'
  push:
    paths:
      - 'packages/**'
      - '.github/workflows/build.yml'

concurrency:
  group: repo-build
  cancel-in-progress: false

permissions:
  contents: write             # коммит обновлённого PKGBUILD
  pages: write                # публикация
  id-token: write             # OIDC для deploy-pages

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.plan.outputs.list }}

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4
        with:
          # нужен предыдущий коммит, чтобы понять, какие PKGBUILD изменились
          fetch-depth: 2

      - name: Узнать актуальную версию Xray
        id: ver
        env:
          # без токена api.github.com отдаёт 60 запросов в час НА IP,
          # а IP у раннеров общий — лимит выгорает мгновенно
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # /releases, а НЕ /releases/latest: XTLS помечает свежие сборки как
          # pre-release, и latest вернул бы версию трёхмесячной давности
          LATEST=$(gh api "repos/XTLS/Xray-core/releases?per_page=1" \
                     --jq '.[0].tag_name' | sed 's/^v//')
          # тег приходит из ЧУЖОГО репозитория — валидируем строго,
          # иначе он попадёт в shell как исполняемый текст
          if ! [[ "$LATEST" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Тег не похож на версию: '$LATEST'"; exit 1
          fi
          CURRENT=$(grep -Po '^pkgver=\K.*' packages/xray-core/PKGBUILD)
          {
            echo "latest=$LATEST"
            echo "current=$CURRENT"
          } >> "$GITHUB_OUTPUT"
          if [ "$LATEST" != "$CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Новая версия Xray: $CURRENT → $LATEST"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Версия актуальна ($CURRENT)"
          fi

      - name: Обновить PKGBUILD под новую версию
        if: steps.ver.outputs.changed == 'true'
        env:
          V: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          URL="https://github.com/XTLS/Xray-core/archive/v${V}/Xray-core-${V}.tar.gz"
          curl -sSL "$URL" -o /tmp/src.tar.gz
          SHA=$(sha256sum /tmp/src.tar.gz | cut -d' ' -f1)
          B2=$(b2sum      /tmp/src.tar.gz | cut -d' ' -f1)
          cd packages/xray-core
          sed -i "s/^pkgver=.*/pkgver=${V}/"             PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/"                PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA}')/" PKGBUILD
          sed -i "s/^b2sums=.*/b2sums=('${B2}')/"        PKGBUILD
          echo "Хеши пересчитаны с исходников по тегу v${V}"

      # Ничего не собираем «на всякий случай»: пересборка одного и того же
      # каждую ночь только жжёт время раннера и плодит в репозитории новые
      # файлы с той же версией.
      - name: Определить, что собирать
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          XRAY_CHANGED: ${{ steps.ver.outputs.changed }}
          INPUT_PKGS: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          ALL=$(find packages -mindepth 1 -maxdepth 1 -type d -printf '%f ')

          case "$EVENT" in
            schedule)
              # по расписанию трогаем только xray и только при новой версии;
              # mpv-git сюда не попадает намеренно — он резервный и собирается
              # руками, когда CachyOS не успел пересобрать его под новый soname
              if [ "$XRAY_CHANGED" = "true" ]; then LIST="xray-core"; else LIST=""; fi
              ;;
            workflow_dispatch)
              if [ -z "${INPUT_PKGS:-}" ] || [ "${INPUT_PKGS}" = "all" ]; then
                LIST="$ALL"
              else
                LIST="$INPUT_PKGS"
              fi
              ;;
            push)
              # правка самого workflow затрагивает все сборки — пересобираем всё
              if git diff --name-only HEAD~1 HEAD | grep -q '^\.github/workflows/'; then
                LIST="$ALL"
              else
                LIST=$(git diff --name-only HEAD~1 HEAD -- packages/ \
                        | cut -d/ -f2 | sort -u | tr '\n' ' ')
              fi
              ;;
            *)
              LIST="$ALL"
              ;;
          esac

          # имена могли прийти из ручного ввода — пропускаем только те,
          # что реально существуют, чтобы в shell не уехал произвольный текст
          SAFE=""
          for p in $LIST; do
            if [ -f "packages/$p/PKGBUILD" ]; then
              SAFE="$SAFE $p"
            else
              echo "::warning::Пакет '$p' пропущен: packages/$p/PKGBUILD не найден"
            fi
          done
          SAFE=$(echo "$SAFE" | xargs || true)

          echo "list=$SAFE" >> "$GITHUB_OUTPUT"
          if [ -z "$SAFE" ]; then
            echo "::notice::Собирать нечего — публикуем репозиторий как есть"
          else
            echo "::notice::К сборке: $SAFE"
          fi

      # База репозитория пересоздаётся с нуля из того, что лежит в out/.
      # Раз собираем выборочно, всё остальное надо вернуть обратно, иначе
      # пакеты, которые мы в этот раз не трогали, просто исчезнут из репозитория.
      - name: Забрать уже опубликованные пакеты
        run: |
          set -euo pipefail
          mkdir -p out
          BASE="https://siberianwm.github.io/elder-arch-repo/x86_64"
          if curl -fsSL "$BASE/elder-arch-repo.db" -o /tmp/current.db 2>/dev/null; then
            FILES=$(zstd -dc /tmp/current.db 2>/dev/null | tar -xO --wildcards '*/desc' 2>/dev/null \
                    | grep -A1 '^%FILENAME%$' | grep '\.pkg\.tar\.zst$' || true)
            n=0
            for f in $FILES; do
              if curl -fsSL "$BASE/$f" -o "out/$f" 2>/dev/null; then
                curl -fsSL "$BASE/$f.sig" -o "out/$f.sig" 2>/dev/null || true
                n=$((n+1))
              fi
            done
            echo "::notice::Возвращено ранее опубликованных пакетов: $n"
          else
            echo "::notice::Опубликованной базы нет — репозиторий собирается с нуля"
          fi

      - name: Собрать и подписать в контейнере CachyOS
        if: steps.plan.outputs.list != ''
        env:
          GPG_KEY:   ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASS:  ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEYID: ${{ secrets.GPG_KEYID }}
          BUILD_LIST: ${{ steps.plan.outputs.list }}
        run: |
          set -euo pipefail
          # ключ передаём через файл, а не аргументом — иначе он виден в ps
          printf '%s' "$GPG_KEY"  > /tmp/signing.key
          printf '%s' "$GPG_PASS" > /tmp/signing.pass
          # образ CachyOS вместо ванильного Arch: те же флаги x86-64-v3, что и
          # в системе, куда пакет поедет — сборка однородна с остальными пакетами
          docker run --rm \
            -v "$PWD:/work" -v /tmp/signing.key:/tmp/signing.key:ro \
            -v /tmp/signing.pass:/tmp/signing.pass:ro \
            -e GPG_KEYID="$GPG_KEYID" \
            -e BUILD_LIST="$BUILD_LIST" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -w /work cachyos/cachyos-v3:latest bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed base-devel git devtools
              # Образ CachyOS собирает с -march=native: на раннере GitHub есть
              # AVX-512, у целевой машины (Haswell) его нет, и бинарь падает
              # с SIGILL. Архитектуру задаём явно — v3 это AVX2/FMA/BMI, ровно
              # то, что поддерживает целевой процессор.
              sed -i -E "s/-march=[a-z0-9._-]+/-march=x86-64-v3/g; s/-mtune=[a-z0-9._-]+/-mtune=generic/g" /etc/makepkg.conf
              grep -E "^(C|CXX|RUST)FLAGS" /etc/makepkg.conf
              useradd -m builder
              # makepkg -s ставит зависимости пакета через pacman и требует sudo;
              # контейнер одноразовый, права живут только внутри него
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              chmod 440 /etc/sudoers.d/builder
              chown -R builder:builder /work

              # ключ импортируем от имени сборщика: makepkg не работает под root
              sudo -u builder gpg --batch --quiet --import /tmp/signing.key
              install -d -o builder -g builder /home/builder/.gnupg
              printf "allow-loopback-pinentry\n" > /home/builder/.gnupg/gpg-agent.conf
              printf "pinentry-mode loopback\npassphrase-file /tmp/signing.pass\nbatch\nyes\n" \
                > /home/builder/.gnupg/gpg.conf
              chown builder:builder /home/builder/.gnupg/*
              sudo -u builder gpg-connect-agent reloadagent /bye >/dev/null 2>&1 || true

              for name in $BUILD_LIST; do
                dir="packages/$name"
                echo "::group::Сборка $name"
                # -s ставит зависимости из самого PKGBUILD, поэтому добавление
                # нового пакета не требует правки workflow
                # --sign подписывает пакет ключом GPGKEY
                sudo -u builder env GPGKEY="$GPG_KEYID" \
                  bash -c "cd /work/$dir && makepkg -Ccfs --noconfirm --needed --sign"
                # прошлые версии этого же пакета убираем, иначе на Pages копится мусор
                rm -f /work/out/"$name"-*.pkg.tar.zst /work/out/"$name"-*.pkg.tar.zst.sig
                cp "$dir"/*.pkg.tar.zst "$dir"/*.pkg.tar.zst.sig /work/out/
                echo "::endgroup::"
              done

              cd /work/out
              # --include-sigs вносит подписи пакетов в саму базу,
              # чтобы pacman мог проверить их до скачивания
              repo-add --include-sigs --new elder-arch-repo.db.tar.zst *.pkg.tar.zst

              # repo-add создаёт СИМЛИНКИ .db и .files, но GitHub Pages их
              # не разворачивает — заменяем реальными копиями
              for l in *.db *.files; do
                if [ -L "$l" ]; then t=$(readlink "$l"); rm "$l"; cp "$t" "$l"; fi
              done
              ls -la
              # контейнер работает от root и забирает права на смонтированный
              # каталог — возвращаем владельца раннеру, иначе следующие шаги
              # не смогут ничего создать в рабочей директории
              chown -R "$HOST_UID:$HOST_GID" /work
            '
          rm -f /tmp/signing.key /tmp/signing.pass

      # База нужна и когда ничего не собирали: тогда она строится из пакетов,
      # возвращённых с Pages, и репозиторий публикуется без изменений
      - name: Пересобрать базу, если сборки не было
        if: steps.plan.outputs.list == ''
        run: |
          set -euo pipefail
          if ls out/*.pkg.tar.zst >/dev/null 2>&1; then
            docker run --rm -v "$PWD/out:/out" -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
              -w /out archlinux:base-devel bash -euo pipefail -c '
                repo-add --include-sigs --new elder-arch-repo.db.tar.zst *.pkg.tar.zst
                for l in *.db *.files; do
                  if [ -L "$l" ]; then t=$(readlink "$l"); rm "$l"; cp "$t" "$l"; fi
                done
                chown -R "$HOST_UID:$HOST_GID" /out
              '
          else
            echo "::warning::Пакетов нет вообще — публиковать нечего"
          fi

      - name: Собрать каталог для публикации
        run: |
          set -euo pipefail
          mkdir -p pages/x86_64
          cp -a out/. pages/x86_64/
          # публичный ключ — по нему машина проверяет подписи пакетов
          cp elder-arch-repo.pub pages/
          cat > pages/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>elder-arch-repo</title>
          <h1>elder-arch-repo</h1>
          <p>Личный pacman-репозиторий. Пакеты собираются из исходников
          и подписываются GPG.</p>
          <p>Подключение описано в README репозитория.</p>
          HTML
          ls -la pages/x86_64/

      - name: Загрузить артефакт Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Зафиксировать обновлённый PKGBUILD
        if: steps.ver.outputs.changed == 'true'
        env:
          FROM: ${{ steps.ver.outputs.current }}
          TO:   ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # только рецепты: исходники и git-клоны в репозиторий не тащим
          git add packages/*/PKGBUILD
          git commit -qm "xray-core: ${FROM} → ${TO}"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опубликовать на Pages
        id: deployment
        uses: actions/deploy-pages@v4
